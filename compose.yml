services:

  shinobi-mcp:
    profiles: [ all ]
    build: src
    image: shinobi/mcp:latest
    container_name: shinobi-mcp
    ports:
      - "8002:8002"
    volumes:
      - shinobi-workspace:/home/shinobi/workspace
    env_file:
      - src/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8002/api/v1/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  terraform-mcp:
    profiles: [ all ]
    image: hashicorp/terraform-mcp-server:latest
    container_name: terraform-mcp
    ports:
      - "8080:8080"
    environment:
      TRANSPORT_MODE: streamable-http
      TRANSPORT_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

volumes:
  shinobi-workspace:
